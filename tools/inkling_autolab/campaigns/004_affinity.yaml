version: 1
name: 004_affinity
hypothesis: Matching Rayon threads to restricted CPU masks may reduce hybrid-core
  contention.
question: q1
moonshot: false
runner:
  backend: ssh
  host: cascadia-tate-07-ts
  user: devcloud
  timeout_seconds: 300
  command: powershell -NoProfile -File C:/Users/devcloud/inkling-autolab/run-bench.ps1
    -Threads {threads} -Mask {mask} -Serial {serial} -Reads {reads} -Samples {samples}
    -Tokens {tokens} -Kind {kind} -Variant {variant} -ExpectedHash {expected_hash}
defaults:
  expected_hash: 4e89f0793afa1015
  mask: 65535
  serial: 0
  reads: 1
  samples: 5
  tokens: 32
  kind: layer
  variant: baseline
  threads: 0
grid:
  mask:
  - 65535
  - 4095
  - 65520
  - 15
metrics:
  primary: layer_tokens_per_s
  direction: maximize
  collect:
  - name: layer_tokens_per_s
    pattern: (?m)^layer_tokens_per_s=([\d.]+)
  - name: layer_ms
    pattern: (?m)^layer_ms=([\d.]+)
  - name: output_hash
    pattern: (?m)^output_hash=([0-9a-f]+)
    type: str
stopping:
  window: 100000
  max_failures: 2
