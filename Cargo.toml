[workspace]
resolver = "2"
members = [
    "crates/cascadia-types",
    "crates/cascadia-topology",
    "crates/cascadia-transport",
    "crates/cascadia-engine",
    "crates/cascadia-engine-mock",
    "crates/cascadia-ov-genai-shim",
    "crates/cascadia-engine-openvino",
    "crates/cascadia-engine-sparse-moe",
    "crates/cascadia-int4-gemm",
    "crates/cascadia-runner",
    "crates/cascadia-discovery",
    "crates/cascadia-download",
    "crates/cascadia-api",
    "crates/cascadia-dashboard",
    "crates/cascadia-cli",
    "crates/cascadia",
    "tests-e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/labscommunity/cascadia"

[workspace.dependencies]
# Internal crates
cascadia-types = { path = "crates/cascadia-types" }
cascadia-topology = { path = "crates/cascadia-topology" }
cascadia-transport = { path = "crates/cascadia-transport" }
cascadia-engine = { path = "crates/cascadia-engine" }
cascadia-engine-mock = { path = "crates/cascadia-engine-mock" }
cascadia-ov-genai-shim = { path = "crates/cascadia-ov-genai-shim" }
cascadia-engine-openvino = { path = "crates/cascadia-engine-openvino" }
cascadia-engine-sparse-moe = { path = "crates/cascadia-engine-sparse-moe" }
cascadia-int4-gemm = { path = "crates/cascadia-int4-gemm" }
cascadia-runner = { path = "crates/cascadia-runner" }
cascadia-discovery = { path = "crates/cascadia-discovery" }
cascadia-download = { path = "crates/cascadia-download" }
cascadia-api = { path = "crates/cascadia-api" }
cascadia-dashboard = { path = "crates/cascadia-dashboard" }
cascadia-cli = { path = "crates/cascadia-cli" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }

# HTTP
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Errors
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"

# OpenVINO binding is the C++ FFI shim (cascadia-ov-genai-shim), not the
# crates.io `openvino*` crates — former workspace pins for them were dead
# (absent from Cargo.lock) and removed in #77 Part A.

# Discovery + downloads
mdns-sd = "0.13"
hf-hub = { version = "0.4", features = ["tokio"] }

# Tokenizers (workaround for missing OV-GenAI Tokenizer in C API)
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# Build deps
cc = "1"
bindgen = "0.71"

# Dev / test
pretty_assertions = "1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "debuginfo"
