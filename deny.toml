# cargo-deny configuration — supply-chain gate for the Cascadia workspace.
# Enforced in CI (.github/workflows/security.yml) and runnable locally:
#   cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Fail the build on any RUSTSEC advisory in the dependency tree. This is the
# real security gate: a NEW vulnerability, unsound, or unmaintained advisory
# turns CI red and forces a review.
#
# The list below is the *accepted baseline* — advisories whose fix is not a
# compatible-version bump away. Each entry states its actual blocker; remove the
# entry when the blocker clears. CI checks with `--all-features`, so the
# optional `zenoh` tree (cascadia-api/cascadia-cli `--features zenoh`) counts.
ignore = [
    "RUSTSEC-2025-0119", # number_prefix 0.4.0 (unmaintained) — transitive via indicatif → hf-hub → cascadia-download; no safe upgrade.
    "RUSTSEC-2024-0436", # paste 1.0.15 (unmaintained) — transitive via tokenizers; no safe upgrade.
    "RUSTSEC-2025-0141", # bincode 2.0.1 (unmaintained) — direct dep of cascadia-kv-wire for KV snapshot codec; team ceased development but considers 2.x complete/stable, no vulnerability. Keep until a maintained equivalent is vetted.
    # lz4_flex 0.10.0 (vulnerability: block decompression of invalid data can leak memory) via zenoh-transport 1.9.0, `zenoh` feature only.
    # Blocked by `zenoh = "=1.9.0"`, the release physicalai's client pins (`eclipse-zenoh==1.9.0`); zenoh-transport 1.10.2, the newest 1.x, still requires lz4_flex ^0.10.
    # Not reachable: lz4_flex's only decompress call (`decompress_into` in zenoh-transport's batch.rs) is compiled only with zenoh-transport's
    # `transport_compression` feature, which our tree does not enable (`cargo tree -e features -i zenoh-transport` shows only `transport_tcp`).
    # Revisit when physicalai moves off zenoh 1.9.0 or a zenoh release takes lz4_flex >= 0.11.6, or if `transport_compression` is ever enabled.
    "RUSTSEC-2026-0041",
    # unsafe-libyaml 0.2.11 (unmaintained) via serde_yaml → zenoh-config 1.9.0, `zenoh` feature only; zenoh-config 1.10.2 still requires serde_yaml.
    # Not reachable: zenoh-config parses YAML only when loading a `.yaml` config file; our sessions start from `Config::default()` plus
    # `insert_json5` keys (cascadia-api policy/zenoh_server.rs `secure_config`) and never read a config file or ZENOH_CONFIG.
    # Revisit on the zenoh bump above.
    "RUSTSEC-2024-0449",
]
# Never ship a version that has been yanked from the registry.
yanked = "deny"

[licenses]
# Cascadia ships Apache-2.0 (see workspace Cargo.toml). Allow the permissive
# licenses common in the Rust ecosystem, plus MPL-2.0 (weak copyleft,
# file-scoped) — all compatible with Apache-2.0 redistribution. Only licenses
# actually present in the tree are listed, so a green run has no unmatched-
# allowance warnings; anything new fails the build and gets reviewed here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
# Require high confidence when detecting a crate's license from its text.
confidence-threshold = 0.9

# Wildcard version requirements never gate an external dep — deny them.
# Intra-workspace deps are bare `path` deps (no version, which Cargo treats as
# `*`); allow-wildcard-paths exempts those because every workspace crate is
# marked `publish = false`. Removing `publish = false` from a crate puts its
# path deps back under this deny.
[bans]
wildcards = "deny"
allow-wildcard-paths = true
# Duplicate versions of the same crate bloat the tree and widen the audit
# surface. Warn (don't fail) — transitive dep graphs make this hard to zero out.
multiple-versions = "warn"

[sources]
# Only pull from crates.io and explicitly-allowed git sources (none currently
# — add `allow-git` entries as needed).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
