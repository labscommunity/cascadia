[project]
name = "tahoma"
version = "0.0.1"
description = "Run any model on Intel hardware"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Labs Community"}]
keywords = ["llm", "inference", "intel", "openvino", "distributed", "pipeline-parallel"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    # transformers 5.x changed rotary attention_scaling for rope_type="llama3"
    # in a way that breaks Llama 3.1 8B Instruct's KV-cache decode (model
    # produces correct first token then degenerate tokens). Pinning to 4.x
    # until the loader is updated to handle the 5.x rotary path correctly.
    "transformers>=4.57,<5.0",
    "safetensors>=0.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
# Optional: OpenVINO Runtime engine (single-stage, INT4 GPU). Requires Intel
# hardware. Install with `pip install tahoma[ov]`.
ov = [
    "openvino>=2026.0",
    "optimum[openvino]>=1.27",
]

[project.scripts]
tahoma = "tahoma.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tahoma*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
