[package]
name = "cascadia-engine-sparse-moe"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Sparse-MoE engine for Kimi K2.6 style models. Runs per-layer shells (Rust by default, OV IR optional) and dispatches only the top-k experts the router selects, instead of running all 384 every step."

[features]
default = []
openvino = ["cascadia-ov-genai-shim/openvino"]

[dependencies]
cascadia-types = { workspace = true }
cascadia-engine = { workspace = true }
cascadia-ov-genai-shim = { workspace = true }
cascadia-int4-gemm = { workspace = true }
cascadia-runner = { workspace = true }
cascadia-transport = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }
half = "2"
lru = "0.18"
memmap2 = "0.9"
rayon = "1"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
