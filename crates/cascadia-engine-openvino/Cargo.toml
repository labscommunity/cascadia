[package]
name = "cascadia-engine-openvino"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenVINO-backed engines for cascadia — wraps cascadia-ov-genai-shim into the Engine + Builder traits."

[features]
default = []
openvino = ["cascadia-ov-genai-shim/openvino"]
# Issue-34 Option C: KV coordination plane support (opaque OV state blobs). Off by default so the
# wire crate stays out of the default build graph (mirrors cascadia-engine-sparse-moe).
kv_coord = ["dep:cascadia-kv-wire", "dep:crc32fast", "cascadia-engine/kv_coord"]

[dependencies]
cascadia-types = { workspace = true }
cascadia-engine = { workspace = true }
cascadia-runner = { workspace = true }
cascadia-transport = { workspace = true }
cascadia-ov-genai-shim = { workspace = true }
cascadia-kv-wire = { path = "../cascadia-kv-wire", optional = true }
crc32fast = { version = "1.4", optional = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }
half = "2"

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
