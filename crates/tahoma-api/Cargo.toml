[package]
name = "tahoma-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenAI-compatible HTTP server (axum). Wraps tahoma-runner with /health, /v1/models, /v1/chat/completions."

[dependencies]
tahoma-types = { workspace = true }
tahoma-engine = { workspace = true }
tahoma-runner = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
bytes = { workspace = true }
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
minijinja-contrib = { version = "2", default-features = false, features = ["pycompat"] }

[dev-dependencies]
tokio = { workspace = true }
tahoma-engine-mock = { workspace = true }
