[package]
name = "cascadia-grammar"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Token masks that keep a model's output inside a JSON Schema (llguidance)."

[features]
# Test vocab for other crates' unit tests (`GrammarFactory::single_byte_for_tests`).
test-util = []

[dependencies]
cascadia-types = { workspace = true }
cascadia-engine = { workspace = true }
llguidance = "1.9.1"
# The resolver llguidance builds with: asked which refs it can resolve.
referencing = "0.29.1"
toktrie_hf_tokenizers = "1.9.1"
tokenizers = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
