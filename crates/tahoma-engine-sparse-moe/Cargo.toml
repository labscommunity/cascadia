[package]
name = "tahoma-engine-sparse-moe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sparse-MoE engine for Kimi K2.6 style models. Loads per-layer shell IRs + per-(layer,expert) IRs and dispatches only the top-k experts the router selects, instead of running all 384 every step."

[features]
default = []
openvino = ["tahoma-ov-genai-shim/openvino"]

[dependencies]
tahoma-types = { workspace = true }
tahoma-engine = { workspace = true }
tahoma-ov-genai-shim = { workspace = true }
tahoma-int4-gemm = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }
half = "2"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
