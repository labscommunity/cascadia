[package]
name = "tahoma"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tahoma binary — distributed LLM inference for Intel hardware (Rust port)."

[features]
default = []
openvino = ["tahoma-cli/openvino"]
dashboard-embed = ["tahoma-cli/dashboard-embed"]

[[bin]]
name = "tahoma"
path = "src/main.rs"

[dependencies]
tahoma-cli = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
