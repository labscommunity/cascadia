[package]
name = "cascadia-api"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenAI-compatible HTTP server (axum). Wraps cascadia-runner with /health, /v1/models, /v1/chat/completions, /v1/responses."

[dependencies]
cascadia-types = { workspace = true }
cascadia-engine = { workspace = true }
cascadia-metrics = { workspace = true }
cascadia-runner = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
bytes = { workspace = true }
# `macros` is required by modern instruct chat templates (Gemma 3/4 define
# `{% macro %}` helpers for tool/role formatting); without it the template
# fails to parse and rendering silently falls back to the legacy formatter,
# which degenerates instruct models. `multi_template` covers `{% include %}`.
# `json` registers the `tojson` filter that Llama-3.1/Qwen tool templates use to
# serialize tool schemas; without it tool requests error and drop to the legacy
# formatter, silently stripping tools from the prompt.
minijinja = { version = "2", default-features = false, features = ["builtins", "serde", "macros", "multi_template", "json"] }
minijinja-contrib = { version = "2", default-features = false, features = ["pycompat"] }
# Image input (`image_url` content parts): decode, downscale and hash once in
# the API so engines only ever see RGB pixels. Formats limited to what
# OpenAI accepts (PNG, JPEG, WEBP, non-animated GIF).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
sha2 = "0.10"
# Opt-in remote image fetch (`--api-allow-image-urls`).
reqwest = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
cascadia-engine-mock = { workspace = true }
async-trait = { workspace = true }
