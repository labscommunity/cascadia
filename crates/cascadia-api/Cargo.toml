[package]
name = "cascadia-api"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenAI-compatible HTTP server (axum). Wraps cascadia-runner with /health, /v1/models, /v1/chat/completions."

[features]
default = []
# Intel physicalai remote-inference front end (Zenoh) for the policy server.
zenoh = ["dep:zenoh"]

[dependencies]
cascadia-types = { workspace = true }
cascadia-engine = { workspace = true }
cascadia-metrics = { workspace = true }
cascadia-runner = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true, features = ["ws"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
bytes = { workspace = true }
# `macros` is required by modern instruct chat templates (Gemma 3/4 define
# `{% macro %}` helpers for tool/role formatting); without it the template
# fails to parse and rendering silently falls back to the legacy formatter,
# which degenerates instruct models. `multi_template` covers `{% include %}`.
# `json` registers the `tojson` filter that Llama-3.1/Qwen tool templates use to
# serialize tool schemas; without it tool requests error and drop to the legacy
# formatter, silently stripping tools from the prompt.
minijinja = { version = "2", default-features = false, features = ["builtins", "serde", "macros", "multi_template", "json", "adjacent_loop_items"] }
minijinja-contrib = { version = "2", default-features = false, features = ["pycompat"] }
# JPEG frames in physicalai requests: pure Rust, no C toolchain, maintained as
# the `image` crate's JPEG decoder.
zune-jpeg = "0.5.15"
# Pinned to the eclipse-zenoh release physicalai locks; TCP is the only link
# its client opens.
zenoh = { version = "=1.9.0", default-features = false, features = ["transport_tcp"], optional = true }
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true }
cascadia-engine-mock = { workspace = true }
async-trait = { workspace = true }
tokio-tungstenite = "0.24"
