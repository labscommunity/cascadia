[package]
name = "tahoma-int4-gemm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Hand-rolled int4 GEMM for the K2.6 expert path — group-32 symmetric quantization with bf16 scales, matching compressed-tensors' on-disk format."

[dependencies]
half = "2"
memmap2 = "0.9"
parking_lot = { workspace = true }
rayon = "1"
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# autolab iter 074/097 (async expert prefetch): Linux-only io_uring dep.
# Gated to cfg(target_os = "linux") because the upstream crate only
# compiles there. On every other platform the `async_prefetch` module
# falls back to the existing madvise / PrefetchVirtualMemory path
# (see crates/tahoma-int4-gemm/src/async_prefetch.rs).
#
# Milestone 1 (iter 097) wires the real backend: AsyncPrefetchBackend
# probes io_uring at init time via a NOP SQE + CQE round-trip and
# falls back gracefully on any failure (kernel <5.1, WSL2,
# seccomp-blocked container). The dep is no longer behind a feature
# flag — it's always pulled on Linux (it's a few KB of FFI bindings),
# and the runtime probe decides whether to use it.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.6"

[features]
# Force the io_uring backend even if the runtime probe says it's
# unavailable. Useful only for diagnostics — production should let
# the probe decide. No-op on non-Linux.
io-uring-force = []

[dev-dependencies]
# (canonical reference decompression for cross-validation lives in
# rainier/scripts/k26_export_per_expert_v2.py — we cross-validate the
# Rust kernel against bytes-on-disk only).

# Milestone-1 io_uring E2E test (Linux only — but tempfile is
# cross-platform, so dropping it in unconditionally is fine and avoids
# a target-gated dev-dependency block).
tempfile = { workspace = true }

[[bench]]
name = "expert_gemm"
harness = false

[lib]
crate-type = ["lib", "cdylib"]

