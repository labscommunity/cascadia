[package]
name = "tahoma-int4-gemm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Hand-rolled int4 GEMM for the K2.6 expert path — group-32 symmetric quantization with bf16 scales, matching compressed-tensors' on-disk format."

[dependencies]
half = "2"
memmap2 = "0.9"
parking_lot = { workspace = true }
rayon = "1"
serde_json = { workspace = true }
thiserror = { workspace = true }

# autolab iter 074 (async expert prefetch): Linux-only io_uring dep.
# Gated to cfg(target_os = "linux") because the upstream crate only
# compiles there. On every other platform the `async_prefetch` module
# falls back to the existing madvise / PrefetchVirtualMemory path
# (see crates/tahoma-int4-gemm/src/async_prefetch.rs). The dep is not
# yet wired into the skeleton — milestone 1 in
# docs/perf/io_uring_prefetch.md will flip it on by replacing the
# `BackendKind::Fallback` constructor with the io_uring init path.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.6", optional = true }

[features]
# Build with the real io_uring backend (Linux only — silently does
# nothing on other platforms). Off by default until milestone 1 of the
# implementation plan lands; flipping it on today just pulls the dep
# without firing any of its code, since the skeleton still constructs
# `BackendKind::Fallback`.
io-uring = ["dep:io-uring"]

[dev-dependencies]
# (canonical reference decompression for cross-validation lives in
# rainier/scripts/k26_export_per_expert_v2.py — we cross-validate the
# Rust kernel against bytes-on-disk only).

[[bench]]
name = "expert_gemm"
harness = false

[lib]
crate-type = ["lib", "cdylib"]

