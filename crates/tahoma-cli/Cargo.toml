[package]
name = "tahoma-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tahoma CLI — clap-based, mirrors the Python `python -m tahoma worker` flag set."

[features]
default = []
openvino = [
    "tahoma-engine-openvino/openvino",
    "tahoma-engine-sparse-moe/openvino",
]
# Embed the built SPA (crates/tahoma-dashboard/web/dist) into the binary.
# Off by default so a fresh `cargo build` doesn't require `npm run build`
# to have been run first. With this on, `tahoma worker --api` serves the
# UI at `/`.
dashboard-embed = ["tahoma-dashboard/embed-spa"]

[dependencies]
tahoma-types = { workspace = true }
tahoma-engine = { workspace = true }
tahoma-engine-mock = { workspace = true }
tahoma-engine-openvino = { workspace = true }
tahoma-engine-sparse-moe = { workspace = true }
tahoma-runner = { workspace = true }
tahoma-api = { workspace = true }
tahoma-dashboard = { workspace = true }
tahoma-topology = { workspace = true }
tahoma-discovery = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tower = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
