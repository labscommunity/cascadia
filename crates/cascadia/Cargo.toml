[package]
name = "cascadia"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "cascadia binary — distributed LLM inference for Intel hardware."

[features]
default = []
openvino = ["cascadia-cli/openvino"]
# Issue-34 Option C: KV-coordination surface (holder + multi-stage capture/RESTORE + total>1 cache).
kv_coord = ["cascadia-cli/kv_coord"]
dashboard-embed = ["cascadia-cli/dashboard-embed"]

[[bin]]
name = "cascadia"
path = "src/main.rs"

[dependencies]
cascadia-cli = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
