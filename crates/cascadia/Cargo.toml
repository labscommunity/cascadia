[package]
name = "cascadia"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "cascadia binary — distributed LLM inference for Intel hardware."
build = "build.rs"

[features]
default = []
# The direct shim dependency is only for its `links` metadata: build.rs
# embeds the OpenVINO lib dirs as LC_RPATH on macOS.
openvino = ["cascadia-cli/openvino", "dep:cascadia-ov-genai-shim"]
# Issue-34 Option C: KV-coordination surface (holder + multi-stage capture/RESTORE + total>1 cache).
kv_coord = ["cascadia-cli/kv_coord"]
dashboard-embed = ["cascadia-cli/dashboard-embed"]

[[bin]]
name = "cascadia"
path = "src/main.rs"

[dependencies]
cascadia-cli = { workspace = true }
cascadia-ov-genai-shim = { workspace = true, optional = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
