[package]
name = "cascadia-engine-llamacpp"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "External llama.cpp SYCL engine: spawns llama-server, proxies its OpenAI API, maps cascadia's --elastic posture to GGML_STREAM_WEIGHTS on the child."

[dependencies]
cascadia-types = { workspace = true }
cascadia-engine = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

# Death guard for the spawned llama-server (see `arm_death_guard`).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
