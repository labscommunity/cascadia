# AI-PC tests: the hardware (OpenVINO / Intel iGPU / NPU) tier, run on the
# self-hosted AI-PC runner pool. The stub-mode unit/lint/build stays in ci.yml
# on GitHub-hosted ubuntu-latest; only the OpenVINO path runs here.
#
# Prereqs:
#   - self-hosted runners online with labels [self-hosted, ai-pc, windows]
#   - repository variable INTEL_OPENVINO_DIR pointing at the OpenVINO GenAI SDK
#     root on the runners.
#   - Git for Windows on the runners (dtolnay/rust-toolchain needs bash; the
#     runner service PATH gets only Git\cmd, not Git\bin).
#
# SECURITY — fork PRs must NEVER run on the self-hosted runners. Untrusted fork
# code here = arbitrary code execution on our hardware. The job-level `if` below
# skips fork PRs, but a fork can edit that guard in its own PR, so it is
# defense-in-depth only. The tamper-proof barriers live in repo/org settings and
# MUST be on before this repo goes public:
#   (1) require approval for workflow runs from all outside collaborators;
#   (2) keep these runners off fork-PR workflows (isolated org runner group
#       and/or ephemeral);
#   (3) enable branch protection on main with ci and cargo-deny as required
#       checks. Caution if making THIS job required: the fork-PR guard and the
#       paths filter both produce *skipped* runs, and skipped satisfies a
#       required check — pair the paths filter with a same-name no-op job and
#       decide explicitly whether skipped-equals-pass is acceptable;
#   (4) after going public, verify the weekly security.yml cron stays enabled —
#       GitHub auto-disables scheduled workflows in public repos after 60 days
#       without repo activity.
# Never add a `pull_request` job on [self-hosted, ...] without the guard.

name: AI-PC tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/cascadia-engine-openvino/**'
      - 'crates/cascadia-ov-genai-shim/**'
      - 'crates/cascadia-engine-sparse-moe/**'
      - 'crates/cascadia-engine/**'
      - 'crates/cascadia-cli/**'
      - 'crates/cascadia/**'
      - 'tests-e2e/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ai-pc-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege: this workflow only needs to read the repo to run tests.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ai-pc-openvino:
    name: build + test (openvino feature, ai-pc)
    # SECURITY: never run a fork PR's code on the self-hosted AI-PC hardware.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ai-pc, windows]
    timeout-minutes: 45
    steps:
      # Actions pinned to full commit SHAs (supply-chain hardening). The
      # trailing comment records the tag (or channel branch, for
      # dtolnay/rust-toolchain, which publishes no tags) for readability
      # and manual bumps.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Persistent self-hosted runner: don't leave the token in .git config.
          persist-credentials: false

      - name: Ensure bash on Windows self-hosted (dtolnay/rust-toolchain needs it)
        shell: powershell
        run: |
          $bash = "C:\Program Files\Git\bin\bash.exe"
          if (Test-Path $bash) {
            "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Added Git bash to PATH"
          } elseif (Get-Command bash -ErrorAction SilentlyContinue) {
            Write-Host "bash already on PATH: $((Get-Command bash).Source)"
          } else {
            Write-Host "::error::bash.exe not found at the default Git for Windows path ($bash) or on PATH - install Git for Windows on this AI-PC runner (winget install --id Git.Git -e)"
            exit 1
          }

      # SHA-pinned: the `stable` channel now comes from `toolchain:`, not the ref.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ai-pc-openvino
          cache-on-failure: true

      - name: Add OpenVINO DLLs to PATH (Windows)
        shell: powershell
        env:
          INTEL_OPENVINO_DIR: ${{ vars.INTEL_OPENVINO_DIR }}
        run: |
          $ov = $env:INTEL_OPENVINO_DIR
          if ([string]::IsNullOrWhiteSpace($ov)) {
            Write-Host "::error::repository variable INTEL_OPENVINO_DIR is not set for this runner"
            exit 1
          }
          foreach ($d in "$ov\runtime\bin\intel64\Release", "$ov\runtime\3rdparty\tbb\bin") {
            if (-not (Test-Path $d)) {
              Write-Host "::error::OpenVINO DLL dir not found: $d - tests would die with STATUS_DLL_NOT_FOUND (0xC0000135)"
              exit 1
            }
            $d | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          Write-Host "Added OpenVINO DLLs to PATH from $ov"

      # Real OpenVINO build (mirrors `just build-ov`).
      - name: Build cascadia with the openvino feature
        env:
          INTEL_OPENVINO_DIR: ${{ vars.INTEL_OPENVINO_DIR }}
        run: cargo build --release -p cascadia --features openvino

      # OV-gated tests (skipped on the ubuntu stub CI because they need the real
      # OpenVINO runtime). Also runs cascadia-ov-genai-shim, which holds the
      # collect_properties int64-coercion tests (ov::Any only, no device needed).
      - name: Run OpenVINO-feature tests
        env:
          INTEL_OPENVINO_DIR: ${{ vars.INTEL_OPENVINO_DIR }}
        run: cargo test -p cascadia-engine-openvino -p cascadia-ov-genai-shim --features openvino --no-fail-fast

      # Optional end-to-end smoke once a small model is staged on the runners:
      # bring up the cascadia binary against the real engine and hit
      # /v1/chat/completions. Left commented until the model fixture path is
      # decided (avoids a guessed CLI invocation).
      #
      # - name: e2e smoke against the real engine
      #   env:
      #     INTEL_OPENVINO_DIR: ${{ vars.INTEL_OPENVINO_DIR }}
      #   run: cargo test -p cascadia-tests-e2e --release -- --test-threads=1
