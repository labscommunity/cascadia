# Build the cascadia OpenVINO binary bundles for Linux and Windows (x86_64) and
# attach them to the GitHub Release for a `vX.Y.Z` tag.
#
# Three ways in:
#   * release-please cuts a tag + pre-release, then calls this workflow in the
#     same run (workflow_call). See release-please.yml.
#   * A maintainer hand-pushes a `v*` tag (e.g. a hotfix) — the push trigger
#     runs this directly and creates the pre-release itself.
#   * Manual re-run for an existing tag via workflow_dispatch (e.g. after a
#     build failure).
# The final job promotes the release (drops the pre-release badge) once both
# bundles are attached — a release is never "full" without its binaries.
#
# Flavor : `--features openvino,dashboard-embed` (real inference + the web
#          dashboard embedded in the binary). Each bundle ships the cascadia
#          binary PLUS the OpenVINO GenAI runtime libraries it dynamically links.
#          The binary does NOT work standalone — see INSTALL.md. The dashboard
#          SPA (web/dist is generated, not checked in) is built once in its
#          own read-only job and downloaded by both build jobs; the
#          cascadia-dashboard build script fails the job with instructions
#          if that download is ever dropped.
# Targets: linux-x86_64, windows-x86_64 (both Intel). macOS has no Intel GPU
#          runtime — it is stub-only (dev) and intentionally not released here.
# Runner : GitHub-hosted. The OpenVINO *build* only links against the SDK
#          headers/libs; it does not need a GPU (a GPU is only required to *run*
#          inference). So hosted runners suffice and releases don't depend on the
#          self-hosted AI-PCs being online.
#
# ┌─ OpenVINO GenAI SDK ───────────────────────────────────────────────────────┐
# │ `OV_VERSION` in `env:` below is the ONE place the bundled SDK release is   │
# │ pinned (ci.yml carries a copy that must match; CI fails if they drift).    │
# │ scripts/ov_sdk.py derives the archive URLs from it and proves each exists  │
# │ with a ranged GET (the storage host answers 200 + an HTML placeholder for  │
# │ missing paths, so a plain HEAD proves nothing).                            │
# │ Other versions, without touching this file:                                │
# │   • workflow_dispatch input `ov_version` builds that SDK instead (e.g. a   │
# │     beta such as 2026.5.0.0beta1); its bundles are named …-ov<version>.…   │
# │   • repository variable OV_EXTRA_VERSIONS (comma-separated) adds those     │
# │     variants to every automatic release, next to the default bundles.     │
# │   • `dry_run` builds the bundles as workflow artifacts and never touches a │
# │     release — try an SDK before pinning it, or build from a branch.        │
# │ Keep the Linux archive's OS matched to the runner (ubuntu22 ↔ ubuntu-22.04)│
# │ so the prebuilt SDK's glibc/ABI lines up with what we link against.         │
# └────────────────────────────────────────────────────────────────────────────┘

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.0)."
        required: true
        type: string
      ov_version:
        description: "OpenVINO GenAI SDK version to bundle instead of OV_VERSION (e.g. 2026.5.0.0beta1)."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Build bundles as workflow artifacts only; never touch a release."
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.0). May be empty only with dry_run (builds this branch)."
        required: false
        type: string
        default: ""
      ov_version:
        description: "OpenVINO GenAI SDK version to bundle instead of the pinned stable (e.g. 2026.5.0.0beta1). Empty = OV_VERSION."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Build the bundles as workflow artifacts only; never touch a release."
        required: false
        type: boolean
        default: false

# Never cancel a half-published release mid-upload. Key on the tag being built.
# `inputs.tag` covers both workflow_call and workflow_dispatch; on tag pushes
# it's empty and github.ref identifies the tag.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

# Least-privilege default; the jobs that touch the release opt into write.
permissions:
  contents: read

env:
  # The OpenVINO GenAI SDK release bundled by default: the newest STABLE
  # release validated on the fleet (single source of truth — see the banner
  # above; scripts/ov_sdk.py turns it into the per-OS archive URLs). Keep
  # ci.yml's OV_VERSION identical; its pin-consistency step enforces it.
  OV_VERSION: "2026.4.1.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── Decide what to build: which OpenVINO GenAI SDK version(s), the bundle
  #    version label, and whether this is a dry run. One tiny read-only job so
  #    both build jobs share one answer and a bad input fails before anything
  #    is downloaded or built.
  plan:
    name: plan (OpenVINO versions)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
      default: ${{ steps.plan.outputs.default }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      ver: ${{ steps.plan.outputs.ver }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      REQUESTED: ${{ inputs.ov_version }}
      EXTRA: ${{ vars.OV_EXTRA_VERSIONS }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - id: plan
        run: |
          # An explicit `ov_version` builds exactly that; otherwise the pinned
          # default plus any OV_EXTRA_VERSIONS variants (deduplicated).
          if [ -n "${REQUESTED:-}" ]; then list="$REQUESTED"; else list="$OV_VERSION,${EXTRA:-}"; fi
          versions=()
          IFS=',' read -ra parts <<< "$list"
          for v in "${parts[@]}"; do
            v="$(printf '%s' "$v" | tr -d '[:space:]')"
            [ -z "$v" ] && continue
            # Shape check: the value reaches shell steps below (via env) and
            # file names, so it must be a plain archive version string.
            if ! printf '%s' "$v" | grep -Eq '^[0-9]{4}\.[0-9]+(\.[0-9]+){0,2}[0-9A-Za-z.]*$'; then
              echo "::error::not an OpenVINO GenAI archive version: '$v' (want e.g. 2026.4.1.0 or 2026.5.0.0beta1)"
              exit 1
            fi
            case " ${versions[*]:-} " in *" $v "*) ;; *) versions+=("$v") ;; esac
          done
          json="$(printf '%s\n' "${versions[@]}" | jq -R . | jq -cs .)"
          # Bundle version label: the tag without its 'v'; a dry run from a
          # branch (no tag) is labelled by commit instead.
          if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            ver="${TAG#v}"
          elif [ "${DRY_RUN:-false}" = "true" ]; then
            ver="dev-${GITHUB_SHA:0:7}"
          else
            echo "::error::no vMAJOR.MINOR.PATCH tag to build (got '$TAG'); pass one, or set dry_run"
            exit 1
          fi
          {
            echo "versions=$json"
            echo "default=$OV_VERSION"
            echo "dry_run=${DRY_RUN:-false}"
            echo "ver=$ver"
          } >> "$GITHUB_OUTPUT"
          echo "OpenVINO GenAI versions to bundle: $json (pinned default $OV_VERSION); bundle label $ver; dry_run=${DRY_RUN:-false}"

  # ── Validate the tag and make sure a Release exists to upload into.
  #    release-please normally created the pre-release already; a hand-pushed
  #    hotfix tag won't have one, so create it here. Idempotent either way.
  #    Skipped on a dry run: nothing is published.
  ensure-release:
    name: validate tag + ensure release
    needs: plan
    if: ${{ needs.plan.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # The tag to build: the call/dispatch input when present, else the pushed tag.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag and ensure a release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Reject a malformed / injected tag before anything is built or shipped.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Refusing to build a malformed tag: '$TAG' (want vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Pre-release until the bundles are attached (the promote job flips it).
            gh release create "$TAG" --prerelease --verify-tag \
              --title "cascadia $TAG" --generate-notes
          fi

  # ── The dashboard SPA is platform-independent, so it is built once here
  #    and both bundles embed the same dist. Keeping npm out of the build
  #    jobs matters beyond deduplication: those jobs hold `contents: write`
  #    and upload the release assets, and `npm ci` runs ~190 third-party
  #    packages' lifecycle scripts. This job can only read the repo.
  build-spa:
    name: dashboard SPA
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Same ref as the build jobs, or a workflow_call run would embed
          # the SPA from the wrong commit.
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # Runner-preinstalled Node (>= 20 on all hosted images) — the JS deps
      # are pinned by package-lock.json via `npm ci`, and a Vite build has
      # no native-addon sensitivity to the Node minor, so a setup-node
      # action would only add a supply-chain pin to maintain.
      - name: Build dashboard SPA
        working-directory: crates/cascadia-dashboard/web
        run: npm ci && npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-dist
          path: crates/cascadia-dashboard/web/dist
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: linux-x86_64 (openvino ${{ matrix.ov_version }})
    needs: [plan, ensure-release, build-spa]
    # Runs after a skipped ensure-release on a dry run, never after a failure.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build-spa.result == 'success' && (needs.plan.outputs.dry_run == 'true' || needs.ensure-release.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        ov_version: ${{ fromJSON(needs.plan.outputs.versions) }}
    # ubuntu-22.04 → glibc 2.35 floor, and matches the ubuntu22 OV archive.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      VER: ${{ needs.plan.outputs.ver }}
      OV_VERSION_SELECTED: ${{ matrix.ov_version }}
      OV_VERSION_DEFAULT: ${{ needs.plan.outputs.default }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Build exactly the tagged commit on either trigger path.
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-linux-openvino

      # INSTALL.md requires g++ >= 12; ubuntu-22.04 ships g++ 11 by default.
      # cc-rs honours $CXX for the C++ shim compile.
      - name: Install g++-12
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12

      - name: Download + extract OpenVINO GenAI SDK ${{ matrix.ov_version }}
        run: |
          # Resolves the archive URL from the version (proving it exists),
          # verifies Intel's published sha256, and lands the SDK root
          # (runtime/, setupvars.sh, …) at --dest.
          root="$(python3 scripts/ov_sdk.py fetch "$OV_VERSION_SELECTED" --os linux --dist ubuntu22 --dest "$RUNNER_TEMP/ov")"
          echo "INTEL_OPENVINO_DIR=$root" >> "$GITHUB_ENV"

      # Built by the build-spa job; web/dist is generated, not checked in.
      # If this step is ever dropped, cascadia-dashboard's build script fails
      # the job with instructions rather than silently shipping without a UI.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dist
          path: crates/cascadia-dashboard/web/dist

      - name: Build cascadia (openvino + dashboard)
        env:
          CXX: g++-12
          # Load the bundled .so's at runtime from a lib/ dir beside the binary.
          # $ORIGIN is a literal token for the dynamic loader — GitHub does not
          # shell-expand env values, so it reaches ld intact.
          # --disable-new-dtags emits DT_RPATH rather than DT_RUNPATH: RUNPATH
          # only covers the binary's own NEEDED entries, while libopenvino.so
          # (which carries no runpath) must still resolve libtbb.so.12 from
          # the same lib/ dir. RPATH applies to those transitive lookups too.
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,$ORIGIN/lib -C link-arg=-Wl,--disable-new-dtags"
        run: cargo build --release -p cascadia --features openvino,dashboard-embed

      - name: Package bundle
        id: pkg
        run: |
          # Bundles built against the pinned default keep the plain name;
          # any other SDK version is spelled out so both can sit on one release.
          name="cascadia-${VER}-linux-x86_64"
          if [ "$OV_VERSION_SELECTED" != "$OV_VERSION_DEFAULT" ]; then name="$name-ov$OV_VERSION_SELECTED"; fi
          dest="$RUNNER_TEMP/$name"
          mkdir -p "$dest/lib"
          cp target/release/cascadia "$dest/"
          # OpenVINO runtime + device plugins (INSTALL.md).
          cp -a "$INTEL_OPENVINO_DIR/runtime/lib/intel64/." "$dest/lib/"
          # TBB, if the SDK keeps it separate rather than under lib/intel64.
          # Shared libraries only — the SDK dir also carries cmake/ and
          # pkgconfig/ dev files that don't belong in a runtime bundle.
          if [ -d "$INTEL_OPENVINO_DIR/runtime/3rdparty/tbb/lib" ]; then
            cp -a "$INTEL_OPENVINO_DIR/runtime/3rdparty/tbb/lib/"lib*.so* "$dest/lib/"
          fi
          # Redistribution notices for the bundled Intel libraries. The 2026.2
          # SDK keeps them in docs/licensing; unconditional so a layout change
          # fails the build instead of silently shipping without notices.
          cp -a "$INTEL_OPENVINO_DIR/docs/licensing" "$dest/openvino-licensing"
          cp INSTALL.md README.md LICENSE THIRD_PARTY_NOTICES.md "$dest/"
          tar -czf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
          echo "asset=$RUNNER_TEMP/$name.tar.gz" >> "$GITHUB_OUTPUT"
          echo "dir=$dest" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the bundle (bundled runtime loads, version matches)
        env:
          BUNDLE_DIR: ${{ steps.pkg.outputs.dir }}
        run: |
          # Exactly what a user does: run from the unpacked dir, no SDK env,
          # no setupvars — rpath $ORIGIN/lib must resolve every library, and
          # doctor must report the SDK release this bundle claims to carry.
          # The one system library the bundle relies on is the OpenCL ICD
          # loader (libopenvino_genai.so imports libOpenCL.so.1 — INSTALL.md);
          # hosted runners don't have it, users' Intel boxes do.
          sudo apt-get install -y --no-install-recommends ocl-icd-libopencl1 >/dev/null
          out="$(cd "$BUNDLE_DIR" && ./cascadia doctor)" || true
          printf '%s\n' "$out" | sed -n '/^OpenVINO:/,$p'
          want="$(printf '%s' "$OV_VERSION_SELECTED" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
          printf '%s\n' "$out" | grep -q "OpenVINO GenAI.*$want" \
            || { echo "::error::doctor did not report OpenVINO GenAI $want from the bundled lib/"; exit 1; }
          printf '%s\n' "$out" | grep -q "OpenVINO devices.*CPU" \
            || { echo "::error::doctor did not enumerate the CPU device from the bundled runtime"; exit 1; }

      - name: Upload bundle to release
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "${{ steps.pkg.outputs.asset }}" --clobber

      - name: Keep bundle as a workflow artifact (dry run)
        if: ${{ env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-linux-x86_64-ov${{ matrix.ov_version }}
          path: ${{ steps.pkg.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: windows-x86_64 (openvino ${{ matrix.ov_version }})
    needs: [plan, ensure-release, build-spa]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build-spa.result == 'success' && (needs.plan.outputs.dry_run == 'true' || needs.ensure-release.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        ov_version: ${{ fromJSON(needs.plan.outputs.versions) }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      VER: ${{ needs.plan.outputs.ver }}
      OV_VERSION_SELECTED: ${{ matrix.ov_version }}
      OV_VERSION_DEFAULT: ${{ needs.plan.outputs.default }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-windows-openvino

      # See the linux job — same artifact, same build-script backstop.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dist
          path: crates/cascadia-dashboard/web/dist

      # MSVC (VS 2022 Build Tools) is preinstalled on windows-latest; cc-rs
      # locates it via vswhere, so no Developer Command Prompt is needed here.
      - name: Download + extract OpenVINO GenAI SDK ${{ matrix.ov_version }}
        shell: pwsh
        run: |
          # Same resolver as the linux job; it prints the SDK root last.
          $root = (python scripts/ov_sdk.py fetch $env:OV_VERSION_SELECTED --os windows --dest "$env:RUNNER_TEMP/ov" | Select-Object -Last 1)
          if (-not (Test-Path "$root/runtime/include")) { throw "ov_sdk did not produce an SDK root: '$root'" }
          "INTEL_OPENVINO_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build cascadia (openvino + dashboard)
        shell: pwsh
        run: cargo build --release -p cascadia --features openvino,dashboard-embed

      - name: Package bundle
        id: pkg
        shell: pwsh
        run: |
          $name = "cascadia-$env:VER-windows-x86_64"
          if ($env:OV_VERSION_SELECTED -ne $env:OV_VERSION_DEFAULT) { $name = "$name-ov$env:OV_VERSION_SELECTED" }
          $dest = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $ov  = $env:INTEL_OPENVINO_DIR
          Copy-Item target/release/cascadia.exe $dest/
          # Windows loads DLLs from the .exe's own directory — keep them flat.
          # openvino.dll + openvino_genai.dll + the device plugin DLLs.
          # (No plugins.xml since OV 2026 — plugin registration is static.)
          Copy-Item "$ov/runtime/bin/intel64/Release/*.dll" $dest/
          # Release TBB only — the SDK ships *_debug.dll variants alongside.
          Copy-Item "$ov/runtime/3rdparty/tbb/bin/*.dll" $dest/ -Exclude *_debug.dll
          # Redistribution notices (see the linux job) — unconditional so a
          # layout change fails the build, not silently drops them.
          Copy-Item -Recurse "$ov/docs/licensing" "$dest/openvino-licensing"
          Copy-Item INSTALL.md,README.md,LICENSE,THIRD_PARTY_NOTICES.md $dest/
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Compress-Archive -Path $dest -DestinationPath $zip -Force
          "asset=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "dir=$dest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Smoke-test the bundle (bundled runtime loads, version matches)
        shell: pwsh
        env:
          BUNDLE_DIR: ${{ steps.pkg.outputs.dir }}
        run: |
          # As a user would run it: the DLLs beside cascadia.exe, no SDK env.
          # (stdout only — doctor prints its report there; pwsh turns native
          # stderr into error records under ErrorActionPreference=Stop.)
          $out = (& (Join-Path $env:BUNDLE_DIR 'cascadia.exe') doctor) -join "`n"
          $i = $out.IndexOf('OpenVINO:'); if ($i -ge 0) { $out.Substring($i) } else { $out }
          $want = [regex]::Match($env:OV_VERSION_SELECTED, '^\d+\.\d+\.\d+').Value
          if ($out -notmatch "OpenVINO GenAI.*$([regex]::Escape($want))") { throw "doctor did not report OpenVINO GenAI $want from the bundled DLLs" }
          if ($out -notmatch "OpenVINO devices.*CPU") { throw "doctor did not enumerate the CPU device from the bundled runtime" }

      - name: Upload bundle to release
        if: ${{ env.DRY_RUN != 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload $env:TAG "${{ steps.pkg.outputs.asset }}" --clobber

      - name: Keep bundle as a workflow artifact (dry run)
        if: ${{ env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-windows-x86_64-ov${{ matrix.ov_version }}
          path: ${{ steps.pkg.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  # ── Promote once both bundles are attached: a release only loses its
  #    pre-release badge when its binaries are verifiably present.
  promote:
    name: promote release
    needs: [plan, build-linux, build-windows]
    if: ${{ !cancelled() && needs.plan.outputs.dry_run != 'true' && needs.build-linux.result == 'success' && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Verify assets and drop the pre-release badge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets="$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(" ")')"
          echo "assets: $assets"
          case "$assets" in
            *linux-x86_64*windows-x86_64*|*windows-x86_64*linux-x86_64*) ;;
            *) echo "::error::expected both linux and windows bundles on $TAG, found: $assets"; exit 1 ;;
          esac
          gh release edit "$TAG" --prerelease=false --latest
          echo "release $TAG promoted"
