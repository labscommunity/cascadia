name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: this workflow only reads the repo to build and test.
# Any job needing more must opt in explicitly.
permissions:
  contents: read

env:
  # Must match release.yml's OV_LINUX_URL — linux-openvino-check below
  # pre-flights that build, and a version skew would quietly un-mirror it.
  OV_LINUX_URL: https://storage.openvinotoolkit.org/repositories/openvino_genai/packages/2026.2/linux/openvino_genai_ubuntu22_2026.2.0.0_x86_64.tar.gz
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: detect linux-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      linux: ${{ steps.filter.outputs.linux }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            linux:
              # This workflow defines the check itself (job steps, OV SDK
              # URL) — changes to it must exercise the job before merge.
              - '.github/workflows/ci.yml'
              - 'crates/cascadia-ov-genai-shim/**'
              - 'crates/cascadia-engine-openvino/**'
              - 'crates/cascadia-engine-sparse-moe/examples/**'
              # openvino-gated code the stub build never compiles also
              # lives in cascadia-cli (engine wiring) and the cascadia
              # bin crate's feature plumbing.
              - 'crates/cascadia-cli/**'
              - 'crates/cascadia/**'
              # A dependency bump can break the openvino-only build.
              - 'Cargo.lock'

  test:
    name: cargo test (stub)
    runs-on: ubuntu-latest
    # Bound the job so a hang can't sit on a runner burning billed minutes.
    timeout-minutes: 30
    steps:
      # Actions pinned to full commit SHAs (supply-chain hardening). The
      # trailing comment records the tag (or channel branch, for
      # dtolnay/rust-toolchain, which publishes no tags) for readability
      # and manual bumps.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Rust
        # SHA-pinned: the `stable` channel now comes from `toolchain:`, not the ref.
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        # Warnings tolerated for now — the engine crates have a few
        # dead-code fields kept around for serde compatibility with
        # legacy shard configs. Promote to `-D warnings` once those
        # are tagged with `#[allow(dead_code)]` or actually used.
        run: cargo clippy --workspace --all-targets

      - name: Build cascadia binary (needed by e2e tests)
        # tests-e2e exec the cascadia binary directly; without this they
        # panic with "cascadia binary not built". Stub mode is fine —
        # the e2e tests use the mock engine.
        run: cargo build -p cascadia

      - name: Test (workspace)
        # Stub-mode build — engines that need OpenVINO link return a
        # clean runtime error. Runs every unit test plus the binary
        # e2e tests against the mock engine.
        run: cargo test --workspace --all-targets

      # Everything above builds default features, and `dashboard-embed` is
      # default-off — so without these steps the whole embedded-SPA path
      # (spa.rs, rust-embed, mime_guess, and build.rs's success branch) is
      # first compiled by the release workflow, at tag time. That workflow
      # only runs once release-please has already created the tag and the
      # GitHub pre-release, so a break there strands a published release
      # with no binaries attached. Compile it on every PR instead.
      #
      # Runner-preinstalled Node (>= 20 on all hosted images); the JS deps
      # are pinned by package-lock.json via `npm ci`.
      - name: Build dashboard SPA
        working-directory: crates/cascadia-dashboard/web
        run: npm ci && npm run build

      - name: Lint + test (dashboard embed path)
        # Also the only lint spa.rs ever gets: the clippy run above is
        # default-features, so the file is invisible to it.
        run: |
          cargo clippy -p cascadia-dashboard --features embed-spa --all-targets
          cargo test -p cascadia-dashboard --features embed-spa

  # Pre-flight the Linux release compile: the openvino C++ shim (gemv_offload.cpp)
  # is only built with --features openvino on ubuntu-22.04 + g++-12 + OV SDK.
  # ci's stub build never touches it, so GCC errors like v0.1.3/v0.1.4
  # (inconsistent bool/int lambda return) passed CI and broke the release
  # mid-publish (tag already created). This job mirrors release.yml's
  # build-linux prerequisites but runs only when Linux-touched paths change,
  # so unrelated PRs pay no extra cycles.
  linux-openvino-check:
    name: linux openvino check (shim + engine)
    needs: changes
    permissions:
      contents: read
    if: needs.changes.outputs.linux == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # PRs: gated by the `changes` job so unrelated PRs skip the OV SDK
    # download + C++ compile. (A workflow-level `on.pull_request.paths`
    # filter can't do this — it would skip the whole workflow, stub tests
    # included.) Pushes to main and manual dispatches always run: a
    # redundant pass there is cheap, and it keeps main verifiably
    # releasable right up to the commit release-please tags.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci-linux-openvino

      - name: Install g++-12
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12

      - name: Download + extract OpenVINO GenAI SDK (linux)
        run: |
          mkdir -p "$RUNNER_TEMP/ov"
          curl -fSL "$OV_LINUX_URL" -o "$RUNNER_TEMP/ov.tgz"
          tar -xzf "$RUNNER_TEMP/ov.tgz" -C "$RUNNER_TEMP/ov" --strip-components=1
          echo "INTEL_OPENVINO_DIR=$RUNNER_TEMP/ov" >> "$GITHUB_ENV"

      - name: Check Linux openvino build (no upload)
        env:
          CXX: g++-12
          # Inert under `cargo check` (nothing links); kept identical to
          # release.yml so a future switch to `cargo build` stays faithful.
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,$ORIGIN/lib -C link-arg=-Wl,--disable-new-dtags"
        run: |
          cargo check -p cascadia --features openvino
          # Examples aren't in `-p cascadia`'s build graph (cargo only
          # builds the named package's own targets), so compile them
          # explicitly — otherwise example-only PRs trigger this job but
          # never compile the files that changed.
          cargo check -p cascadia-engine-sparse-moe --examples --features openvino

      - name: Verify bundled licensing layout (fails fast if SDK moved)
        run: test -d "$INTEL_OPENVINO_DIR/docs/licensing" || (echo "::error::OV licensing dir missing at $INTEL_OPENVINO_DIR/docs/licensing"; exit 1)
