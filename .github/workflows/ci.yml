name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (stub)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        # Warnings tolerated for now — the engine crates have a few
        # dead-code fields kept around for serde compatibility with
        # rainier shard configs. Promote to `-D warnings` once those
        # are tagged with `#[allow(dead_code)]` or actually used.
        run: cargo clippy --workspace --all-targets

      - name: Build tahoma binary (needed by e2e tests)
        # tests-e2e exec the tahoma binary directly; without this they
        # panic with "tahoma binary not built". Stub mode is fine —
        # the e2e tests use the mock engine.
        run: cargo build -p tahoma

      - name: Test (workspace)
        # Stub-mode build — engines that need OpenVINO link return a
        # clean runtime error. Runs every unit test plus the binary
        # e2e tests against the mock engine.
        run: cargo test --workspace --all-targets
