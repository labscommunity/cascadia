name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: this workflow only reads the repo to build and test.
# Any job needing more must opt in explicitly.
permissions:
  contents: read

jobs:
  test:
    name: cargo test (stub)
    runs-on: ubuntu-latest
    # Bound the job so a hang can't sit on a runner burning billed minutes.
    timeout-minutes: 30
    steps:
      # Actions pinned to full commit SHAs (supply-chain hardening). The
      # trailing comment records the tag (or channel branch, for
      # dtolnay/rust-toolchain, which publishes no tags) for readability
      # and manual bumps.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Rust
        # SHA-pinned: the `stable` channel now comes from `toolchain:`, not the ref.
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        # Warnings tolerated for now — the engine crates have a few
        # dead-code fields kept around for serde compatibility with
        # legacy shard configs. Promote to `-D warnings` once those
        # are tagged with `#[allow(dead_code)]` or actually used.
        run: cargo clippy --workspace --all-targets

      - name: Build cascadia binary (needed by e2e tests)
        # tests-e2e exec the cascadia binary directly; without this they
        # panic with "cascadia binary not built". Stub mode is fine —
        # the e2e tests use the mock engine.
        run: cargo build -p cascadia

      - name: Test (workspace)
        # Stub-mode build — engines that need OpenVINO link return a
        # clean runtime error. Runs every unit test plus the binary
        # e2e tests against the mock engine.
        run: cargo test --workspace --all-targets

      # Everything above builds default features, and `dashboard-embed` is
      # default-off — so without these steps the whole embedded-SPA path
      # (spa.rs, rust-embed, mime_guess, and build.rs's success branch) is
      # first compiled by the release workflow, at tag time. That workflow
      # only runs once release-please has already created the tag and the
      # GitHub pre-release, so a break there strands a published release
      # with no binaries attached. Compile it on every PR instead.
      #
      # Runner-preinstalled Node (>= 20 on all hosted images); the JS deps
      # are pinned by package-lock.json via `npm ci`.
      - name: Build dashboard SPA
        working-directory: crates/cascadia-dashboard/web
        run: npm ci && npm run build

      - name: Lint + test (dashboard embed path)
        # Also the only lint spa.rs ever gets: the clippy run above is
        # default-features, so the file is invisible to it.
        run: |
          cargo clippy -p cascadia-dashboard --features embed-spa --all-targets
          cargo test -p cascadia-dashboard --features embed-spa

  kv-coord:
    # `kv_coord` is off by default in both engine crates, so the `test` job
    # above never compiles it — the tenant-namespace confinement tests
    # (`lookup_is_confined_to_the_callers_namespace` and friends) ran in no
    # job at all. Dropping the partner filter from a prefix lookup would have
    # left CI green and silently reopened the cross-tenant prefix-recovery
    # oracle. Two crates, no e2e binary: ~40 extra tests, seconds of runner.
    name: cargo test (kv_coord engines)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-kv-coord-${{ hashFiles('Cargo.lock') }}

      - name: Test (engines, --features kv_coord)
        # Per-package `pkg/feature` syntax: a bare `--features kv_coord` is
        # ambiguous across a multi-package `-p` selection.
        run: >
          cargo test
          -p cascadia-engine-openvino
          -p cascadia-engine-sparse-moe
          --features cascadia-engine-openvino/kv_coord,cascadia-engine-sparse-moe/kv_coord

      - name: Check (workspace, --features kv_coord)
        # The job above compiles kv_coord for TWO packages only, so a kv_coord-gated
        # break anywhere else in the workspace is invisible to CI. Cheap `check`
        # rather than `test` — this exists to catch compile breakage, and the tests
        # that matter for kv_coord already run above.
        run: >
          cargo check --workspace --all-targets
          --features cascadia-engine-openvino/kv_coord,cascadia-engine-sparse-moe/kv_coord
