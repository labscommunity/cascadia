name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU-only torch + dev deps)
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the runner image small and avoids the CUDA
          # download. The OpenVINO engines are skipped because [ov] requires
          # Intel hardware that GitHub-hosted runners don't have.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check tahoma/ tests/

      - name: Test (pytest)
        run: pytest tests/ -v
